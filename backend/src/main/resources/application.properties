spring.application.name=learngrid-backend

# Database Configuration (H2 File-based for Permanent Persistence)
spring.datasource.url=jdbc:h2:file:./data/learngrid;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;FILE_LOCK=NO
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration
learngrid.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
learngrid.jwt.expiration=86400000

# Server Configuration
server.port=8080

# AWS S3 Configuration (Disabled by default)
aws.s3.enabled=false
aws.s3.bucket=learngrid-assets
aws.accessKey=mock
aws.secretKey=mock
aws.region=us-east-1

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Groq AI Config
# Replaces old Gemini credentials
google.gemini.api.key=${GROQ_API_KEY:placeholder}
google.gemini.url=https://api.groq.com/openai/v1/chat/completions

# Razorpay Configuration
razorpay.key.id=rzp_test_mockkeyid12345
razorpay.key.secret=mocksecret1234567890
razorpay.currency=INR

# Frontend Link Context (for QR code and emails)
frontend.url=http://localhost:4200

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=profile,email

# SMTP Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gatherly.noreply@gmail.com
spring.mail.password=${SMTP_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

